<!doctype html>
<html lang="ru">
<head>
  <title>{{ site.title }}</title>
  <meta charset="utf-8"/>
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <link
    rel="stylesheet"
    href="/assets/css/base.css"
  />

  <!-- SEO -->
  <meta
    name="description"
    content="{{ site.description }}"
  />
  <meta
    property="og:title"
    content="{{ page.title }}"
  />
  <meta
    property="og:description"
    content="{{ site.description }}"
  />
  <meta
    property="og:type"
    content="website"
  />

  <!-- Google Fonts -->
  {% include fonts.html %}
</head>
<body>
  {{ content }}
</body>
</html>
